[project]
name = "redcardapi"
version = "2.0.0"
description = "Printable know-your-rights card PDFs in many languages."
requires-python = ">=3.11"
license = "MIT"

# Dependencies are pinned in requirements.txt (compiled from requirements.in).

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/Query() in defaults is idiomatic
