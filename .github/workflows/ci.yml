name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: python -m scripts.validate_translations
      - run: pytest -q
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t redcardapi .
      - name: Container becomes ready and renders a PDF
        run: |
          docker run -d --name api -p 8000:8000 redcardapi
          for i in $(seq 1 30); do curl -fs localhost:8000/api/ready && break; sleep 1; done
          curl -fs -o /tmp/es.pdf localhost:8000/api/render/es
          head -c 4 /tmp/es.pdf | grep -q '%PDF'
